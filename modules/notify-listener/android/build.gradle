plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.anshthakur.notifyring.listener'
version = '0.1.0'

android {
  namespace "com.anshthakur.notifyring.listener"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.appcompat:appcompat:1.7.0'
}
